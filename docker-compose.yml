services:

  ollama:
    image: ollama/ollama:latest
    container_name: docuia-ollama

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    restart: unless-stopped


volumes:
  ollama_data: